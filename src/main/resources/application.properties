spring.application.name=CSNfribeloppAPI

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate skapar och ändrar tabeller automatiskt. Byt till validate i produktion
# (DDL_AUTO=validate) när databasschemat hanteras med migreringar, till exempel Flyway.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Flyway kör migreringarna i db/migration. En befintlig databas markeras som version 1
# och får bara de nya migreringarna, en ny databas får alla.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=5000

# Skicka aldrig ut felmeddelanden, stacktraces eller bindningsfel till klienten.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}

# Kommaseparerad lista med tillåtna origins för webbklienten.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger är avstängt som standard. Sätt SWAGGER_ENABLED=true lokalt när du vill använda det.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
